<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplikasi Todo List</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Container Todo App -->
    <div class="todo-app">

        <!-- Judul -->
        <h2>Todo List</h2>

        <!-- ✅ FITUR 1: Ringkasan Jumlah Tugas (dinamis) -->
        <p id="taskCounter" class="task-counter">
            Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0
        </p>

        <!-- Form Tambah Tugas -->
        <form id="todoForm">

            <div class="input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Masukkan tugas..."
                    autocomplete="off"
                >

                <button type="submit" class="add-btn">
                    Tambah
                </button>

            </div>

            <!-- Pesan Error (ID duplikat sudah diperbaiki) -->
            <p id="inputError" class="error-message">
                Tugas minimal 3 karakter!
            </p>

        </form>

        <!-- Daftar Tugas -->
        <ul id="todoList" class="todo-list"></ul>

        <!-- ✅ FITUR 2: Tombol Bersihkan Tugas Selesai -->
        <div class="todo-footer">
            <button type="button" id="clearCompletedBtn" class="clear-btn">
                🗑️ Bersihkan Tugas Selesai
            </button>
        </div>

    </div>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>

</body>

</html>
